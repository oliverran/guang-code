name: Terminal and Web smoke tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Node ${{ matrix.node }} smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Keep the exact minimum alongside the currently supported LTS lines.
        node: ['22.12.0', '22.x', '24.x', '26.x']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install terminal and Web dependencies
        run: npm ci --workspaces=false --no-audit --no-fund
        env:
          npm_config_engine_strict: 'true'

      - name: Check JavaScript syntax
        run: find dist scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check

      - name: Run credential-free smoke tests
        run: npm run test:smoke
